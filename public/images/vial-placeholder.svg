<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 400" fill="none">
  <!-- Cap -->
  <rect x="70" y="20" width="60" height="35" rx="4" fill="#1a1a1a"/>
  <rect x="75" y="25" width="50" height="25" rx="2" fill="#2d2d2d"/>
  <!-- Vial body - clear glass effect -->
  <path d="M75 55 L75 360 Q75 380 100 380 L100 380 Q125 380 125 360 L125 55 Z" fill="url(#glass)" stroke="#9ca3af" stroke-width="2"/>
  <!-- Liquid fill - subtle blue-green -->
  <path d="M78 320 L78 58 L122 58 L122 320 Z" fill="url(#liquid)" opacity="0.6"/>
  <defs>
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e5e7eb"/>
      <stop offset="50%" style="stop-color:#f9fafb"/>
      <stop offset="100%" style="stop-color:#e5e7eb"/>
    </linearGradient>
    <linearGradient id="liquid" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#16a34a"/>
      <stop offset="100%" style="stop-color:#22c55e"/>
    </linearGradient>
  </defs>
</svg>
